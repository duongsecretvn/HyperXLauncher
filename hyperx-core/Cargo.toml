[workspace]
resolver = "2"
members = [
    "crates/hyperx-core-types",
    "crates/hyperx-core-assets",
    "crates/hyperx-core-protocol",
    "crates/hyperx-core-world",
    "crates/hyperx-core-render",
    "crates/hyperx-client-app", "crates/hyperx-launcher-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HyperXLauncher Team <duongsecretvn@gmail.com>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
uuid = { version = "1.10", features = ["v4", "v3", "serde"] }
thiserror = "1.0"
flate2 = "1.0"
aes = "0.8"
cfb8 = "0.8"
glam = "0.29"
winit = "0.30"
wgpu = { version = "22.0", default-features = false, features = ["wgsl"] }
bytemuck = { version = "1.18", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
pollster = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

