name: Build HyperXLauncher

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm binfmt-support qemu-user-static || true
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build UI (xmcl-keystone-ui)
        run: pnpm run --prefix xmcl-keystone-ui build

      - name: Build Electron App
        run: pnpm run --prefix xmcl-electron-app build:all
        env:
          NODE_ENV: production
          BUILD_TARGET: all
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Artifacts (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: HyperXLauncher-${{ matrix.platform }}
          path: |
            xmcl-electron-app/build/output/*.exe
            xmcl-electron-app/build/output/*.zip
            xmcl-electron-app/build/output/*.AppImage
            xmcl-electron-app/build/output/*.deb
            xmcl-electron-app/build/output/*.tar.xz
            xmcl-electron-app/build/output/*.dmg
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.exe
            release-artifacts/*.zip
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.tar.xz
            release-artifacts/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
